<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="/PT.css">
</head>
<body>  
  <section class="pricing-section">
    <h2 class="section-title">Choose Your Website Plan</h2>
    <div class="pricing-container">
      <!-- Basic Plan -->
      <div class="pricing-card">
        <h3>Basic</h3>
        <p class="price">299$<span>/month</span></p>
        <ul class="features">
          <li>10Website</li>
          <li>100 GB Storage</li>
          <li>Email Support</li>
        </ul>
        <a href="#" class="btn">Get Started</a>
      </div>

      <!-- Pro Plan -->
      <div class="pricing-card featured">
        <h3>Pro</h3>
        <p class="price">599$<span>/month</span></p>
        <ul class="features">
          <li>100 Websites</li>
          <li>1000 GB Storage</li>
          <li>Priority Support</li>
        </ul>
        <a href="#" class="btn">Start Free Trial</a>
      </div>

      <!-- Business  Plan -->
     <div class="pricing-card">
        <h3>Business</h3>
        <p class="price">$999<span>/month</span></p>
        <ul class="features">
          <li>Unlimited Sites</li>
          <li>10 TB Storage</li>
          <li>24/7 Support</li>
        </ul>
        <a href="#" class="btn">Get Started</a>
      </div>
    </div>
  </section>
</body>      
</html>
