<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Grid</title>
  <link rel="stylesheet" href="pc.css" />
</head>
<body>
  <section class="product-grid">
    <div class="product-card">
      <img src="/images/volkswagenR-line.jpg" alt="Product 1">
      <h2>Volkswagen Tiguan R-line</h2>
      <p class="price">50.00 lakh</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="/images/skoda_kodiaq.png" alt="Product 2">
      <h2>Skoda Kodiaq</h2>
      <p class="price">57.00 lakh</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="/images/jeepwrangler.jpg" alt="Product 3">
      <h2>jeep Wrangler</h2>
      <p class="price">81.00 lakh</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="/images/BMWMW5.jpg" alt="Product 4">
      <h2>BMW M5</h2>
      <p class="price">2.40 crore</p>
      <button>Add to Cart</button>
    </div>
  </section>
</body>
</html>
