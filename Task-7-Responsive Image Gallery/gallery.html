<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <div class="gallery-container">
    <h1>Image Gallery</h1>
    <div class="gallery-grid">
      <div class="gallery-item">
        <img src="/images/nature.jpg" alt="Gallery Image 1" />
      </div>
      <div class="gallery-item">
        <img src="/images/mountain.jpg" alt="Gallery Image 2" />
      </div>
      <div class="gallery-item">
        <img src="/images/jungle.jpg" alt="Gallery Image 3" />
      </div>
      <div class="gallery-item">
        <img src="/images/stromocean.jpg" alt="Gallery Image 4" />
      </div>
      <div class="gallery-item">
        <img src="/images/king.jpg" alt="Gallery Image 5" />
      </div>
      <div class="gallery-item">
        <img src="/images/Abhishek.jpg" alt="Gallery Image 6" />
      </div>
    </div>
  </div>
</body>
</html>
